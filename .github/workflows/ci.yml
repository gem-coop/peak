name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  BUNDLE_WITH: avo
  BUNDLE_PACKAGER__DEV: ${{ secrets.BUNDLE_PACKAGER__DEV }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    services:
      postgres:
        image: postgres
        # env:
        #   POSTGRES_USER: postgres
        #   POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=1s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure database
        run: cp config/database.ci.yml config/database.yml

      - parallel:
        # - name: Set up Ruby
        #   uses: spinel-coop/setup-rv@main
        #   with:
        #     ruby-version: current
        #     install-gems: true
        - name: Set up Ruby
          uses: ruby/setup-ruby@v1
          with:
            bundler-cache: true

        - uses: oven-sh/setup-bun@v2
          with:
            bun-version: 1.3.5

        - name: Prepare RuboCop cache
          uses: actions/cache@v6
          env:
            DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
          with:
            path: ${{ env.RUBOCOP_CACHE_ROOT }}
            key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
            restore-keys: |
              rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - parallel:
        - run: bun run build
        - run: bin/lint -f github
        - run: bin/scan
        - run: bin/rails db:seed
          env:
            DATABASE_URL: postgresql://localhost/peak_development

      - name: Run tests
        run: bin/rails db:test:prepare test
        env:
          DATABASE_URL: postgresql://localhost/peak_test
          # BACKTRACE: 1
