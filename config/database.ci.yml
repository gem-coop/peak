default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: peak
  host: localhost
  checkout_timeout: 5

development:
  <<: *default
  database: peak_development

test:
  <<: *default
  database: peak_test

production:
  <<: *default
  database: peak_production
  url: <%= ENV["DATABASE_URL"] %>
